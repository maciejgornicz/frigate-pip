[package]
name = "frigate-pip"
version = "1.6.2"
edition = "2021"
rust-version = "1.87"
description = "Instant picture-in-picture camera windows for Frigate NVR detections"
license = "GPL-3.0-only"
repository = "https://github.com/maciejgornicz/frigate-pip"
readme = "README.md"

# HTTPS and WSS to Frigate's port 8971 or a reverse proxy (src/tls.rs): the system's
# SChannel on Windows (no C compiler needed), rustls on Linux.
[target.'cfg(windows)'.dependencies.schannel]
# 0.1.27 still links like windows 0.58 (import libraries): newer ones need dlltool on GNU.
version = "=0.1.27"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
fontdue = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"

# Debian package of the Linux version (cargo deb --target <musl target> --no-build).
[package.metadata.deb]
maintainer = "maciejgornicz <278948+maciejgornicz@users.noreply.github.com>"
copyright = "2026 maciejgornicz"
extended-description = """\
Shows a camera window the moment Frigate detects a person, a car or another \
object - on the desktop (X11, or Wayland with XWayland), on the framebuffer of \
a console without a desktop (e.g. a Raspberry Pi with a monitor), inside a \
terminal (Kitty graphics, Sixel or coloured half blocks) or as tmux popups. \
Video is decoded by ffmpeg."""
depends = "ffmpeg"
recommends = "fonts-dejavu-core"
suggests = "tmux"
section = "video"
priority = "optional"
revision = ""
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/frigate-pip", "usr/bin/", "755"],
    ["packaging/frigate-pip@.service", "usr/lib/systemd/system/", "644"],
    ["packaging/frigate-pip.desktop", "usr/share/applications/", "644"],
    ["packaging/frigate-pip.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/frigate-pip/", "644"],
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
