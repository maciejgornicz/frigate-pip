name: Build

on:
  # Changes to the documentation alone build nothing. Tags always build: GitHub does not
  # apply path filters to them.
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A "Release x.y.z" commit on main is built by its tag's run, which also publishes it.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y | Out-Null
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup not found" }
          & $iscc /Q "/DAppVersion=$version" installer\frigate-pip.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\frigate-pip.exe "dist\FrigatePiP-$version-portable.exe"
          Copy-Item target\installer\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: FrigatePiP
          path: dist/

  linux:
    # A "Release x.y.z" commit on main is built by its tag's run, which also publishes it.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x86_64
            deb: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Build (static, musl)
        run: |
          cargo build --release --target ${{ matrix.target }}
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp target/${{ matrix.target }}/release/frigate-pip dist/
          tar czf "dist/FrigatePiP-$version-linux-${{ matrix.arch }}.tar.gz" -C dist frigate-pip
          rm dist/frigate-pip

      - name: Debian package
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cargo deb --target ${{ matrix.target }} --no-build --no-strip --output "dist/frigate-pip_${version}_${{ matrix.deb }}.deb"
          dpkg-deb -I dist/*.deb

      - name: Install the Debian package
        run: |
          sudo apt-get install -y -qq ./dist/frigate-pip_*.deb > /dev/null
          frigate-pip --version
          systemd-analyze verify /usr/lib/systemd/system/frigate-pip@.service
          sudo systemctl enable frigate-pip@runner
          # Upgrade path (postinst), then removal must disable the service (prerm).
          sudo apt-get install -y -qq --reinstall ./dist/frigate-pip_*.deb > /dev/null
          sudo apt-get remove -y -qq frigate-pip > /dev/null
          if [ -e /usr/bin/frigate-pip ] || ls /etc/systemd/system/*.wants/frigate-pip@* 2>/dev/null; then
            echo "frigate-pip was left behind"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FrigatePiP-linux-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: FrigatePiP*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe *.tar.gz *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "FrigatePiP ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  apt:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets: inherit
